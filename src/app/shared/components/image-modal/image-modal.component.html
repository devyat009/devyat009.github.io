<div *ngIf="isOpen"
     class="image-modal-backdrop"
     (click)="onBackdropClick($event)"
     role="dialog"
     aria-modal="true">

  <!-- Header Bar -->
  <header class="modal-header">
    <div class="modal-info">
      <h3 *ngIf="localizedTitle" class="modal-title">{{ localizedTitle }}</h3>
    </div>

    <!-- Zoom & Action Controls -->
    <div class="modal-actions" (click)="$event.stopPropagation()">
      <div class="zoom-controls">
        <button type="button"
                class="control-btn"
                [disabled]="scale <= minScale"
                (click)="zoomOut()"
                aria-label="Zoom Out"
                title="Diminuir Zoom (-)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>

        <span class="zoom-badge" (click)="resetZoom()" title="Clique para redefinir para 100%">
          {{ zoomPercentage }}%
        </span>

        <button type="button"
                class="control-btn"
                [disabled]="scale >= maxScale"
                (click)="zoomIn()"
                aria-label="Zoom In"
                title="Aumentar Zoom (+)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>

        <button type="button"
                class="control-btn"
                (click)="resetZoom()"
                aria-label="Reset Zoom"
                title="Redefinir Zoom (100%)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>

      <button type="button"
              class="control-btn close-btn"
              (click)="close()"
              aria-label="Close"
              title="Fechar (Esc)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Viewport Area (Container que delimita rigorosamente a imagem) -->
  <main class="modal-viewport"
        #viewportRef
        (wheel)="onWheel($event)"
        (mousedown)="onMouseDown($event)"
        (touchstart)="onTouchStart($event)"
        (touchmove)="onTouchMove($event)"
        (touchend)="onTouchEnd($event)"
        (dblclick)="onDoubleClick($event)">

    <!-- Loading Spinner -->
    <div *ngIf="!imageLoaded" class="loading-indicator">
      <div class="spinner"></div>
    </div>

    <!-- Scaled & Dragged Image Wrapper -->
    <div class="image-wrapper"
         [class.dragging]="isDragging"
         [style.transform]="'translate3d(' + translateX + 'px, ' + translateY + 'px, 0px) scale(' + scale + ')'"
         [style.cursor]="scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'zoom-in'">

      <img #imageRef
           [src]="currentData?.src"
           [alt]="currentData?.alt || ''"
           (load)="onImageLoad()"
           (dragstart)="$event.preventDefault()"
           class="modal-image" />
    </div>
  </main>

  <!-- Footer Bar (Legenda e Dicas de Atalhos) -->
  <footer class="modal-footer" *ngIf="localizedCaption || scale > 1">
    <div *ngIf="localizedCaption" class="caption-card">
      <p class="caption-text">{{ localizedCaption }}</p>
    </div>

    <div class="hints-pill hidden md:flex">
      <span>Duplo clique: zoom</span>
      <span class="hint-separator">•</span>
      <span>Scroll: ampliar/reduzir</span>
      <span *ngIf="scale > 1" class="hint-separator">•</span>
      <span *ngIf="scale > 1">Arraste para mover (respeitando os limites)</span>
    </div>
  </footer>
</div>
